# cfg4ai 发布配置（goreleaser）
# 纪律：CGO_ENABLED=0 纯静态（麒麟/静态分发）；六 target；checksums；deb/rpm。
version: 2
project_name: cfg4ai

builds:
  - id: cfg4ai
    main: ./cmd/cfg4ai
    binary: cfg4ai
    env:
      - CGO_ENABLED=0
    goos: [windows, darwin, linux]
    goarch: [amd64, arm64, loong64]
    ignore:
      - goos: windows
        goarch: loong64
      - goos: darwin
        goarch: loong64
    ldflags:
      - -s -w -X main.version={{.Version}}

  - id: cfg4ai-desktop
    main: ./cmd/cfg4ai-desktop
    binary: cfg4ai-desktop
    env:
      - CGO_ENABLED=0
    goos: [windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -H windowsgui -X main.version={{.Version}}

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds: [cfg4ai]
    files: [README.md, docs/cfg4ai-design.html]
  - id: windows
    formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds: [cfg4ai]
    files: [README.md]
  - id: desktop
    formats: [zip]
    name_template: "{{ .ProjectName }}-desktop_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds: [cfg4ai-desktop]
    files: [README.md]

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# Linux 包（deb/rpm），麒麟等发行版可装
nfpms:
  - id: cfg4ai
    package_name: cfg4ai
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    vendor: cfg4ai
    homepage: https://github.com/timywel/ai4config
    description: AI 编码工具配置的采集、治理与迁移系统
    license: MIT
    formats: [deb, rpm]
    # 二进制由 goreleaser 自动装入 /usr/bin；contents 仅放额外文件

release:
  name_template: "v{{.Version}}"
  footer: |
    ## 安装
    - Windows: 下载 zip 解压，或用 `install.ps1`
    - macOS/Linux: 下载 tar.gz，或用 `install.sh`
    - Debian/Ubuntu/麒麟(deb)：`.deb`；麒麟(rpm)：`.rpm`