<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cfg4ai</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; margin: 0; background: #f6f7f9; color: #1f2329; }
  .app { display: flex; min-height: 100vh; }
  nav { width: 180px; background: #fff; border-right: 1px solid #e5e7eb; padding: 16px 0; position: sticky; top: 0; height: 100vh; }
  nav .logo { font-weight: 700; color: #1a5fb4; padding: 0 18px 16px; border-bottom: 1px solid #eee; font-size: 17px; }
  nav a { display: block; padding: 10px 18px; color: #4b5563; text-decoration: none; font-size: 14px; border-left: 3px solid transparent; cursor: pointer; }
  nav a:hover { background: #f6f7f9; }
  nav a.active { color: #1a5fb4; border-left-color: #1a5fb4; background: #e8f0fa; font-weight: 600; }
  main { flex: 1; padding: 24px 32px; }
  .page { display: none; }
  .page.active { display: block; }
  .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 20px; margin-bottom: 18px; }
  h2 { font-size: 18px; margin: 0 0 16px; }
  .stats { display: flex; gap: 16px; flex-wrap: wrap; }
  .stat { flex: 1; min-width: 140px; background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 18px; text-align: center; }
  .stat .num { font-size: 28px; font-weight: 700; color: #1a5fb4; }
  .stat .label { font-size: 13px; color: #6b7280; margin-top: 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #eee; }
  th { background: #f6f7f9; }
  .kind { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 10px; background: #e8f0fa; color: #1a5fb4; }
  button { background: #1a5fb4; color: #fff; border: none; padding: 8px 18px; border-radius: 6px; cursor: pointer; font-size: 14px; }
  button:hover { background: #1550a0; }
  button.sec { background: #fff; color: #1a5fb4; border: 1px solid #1a5fb4; }
  button.warn { background: #b4530a; }
  select, input[type=text] { padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 12px 0; }
  .msg { padding: 10px 14px; border-radius: 6px; margin: 12px 0; font-size: 14px; display: none; }
  .msg.ok { background: #ecf7ef; color: #1e7e34; display: block; }
  .msg.err { background: #fdeeee; color: #b03a3a; display: block; }
  .files { background: #282c34; color: #dfe3ea; padding: 12px; border-radius: 6px; font-family: Consolas, monospace; font-size: 12px; max-height: 240px; overflow: auto; display: none; white-space: pre; }
  .empty { color: #888; text-align: center; padding: 30px; }
</style>
</head>
<body>
<div class="app">
  <nav>
    <div class="logo">cfg4ai</div>
    <a data-page="dashboard" class="active">仪表盘</a>
    <a data-page="entities">实体浏览</a>
    <a data-page="collect">采集</a>
    <a data-page="export">导出/迁移</a>
    <a data-page="snapshots">快照</a>
  </nav>
  <main>
    <section id="page-dashboard" class="page active">
      <div class="card"><h2>概览</h2>
        <div class="stats">
          <div class="stat"><div class="num" id="stat-tools">-</div><div class="label">已接入工具</div></div>
          <div class="stat"><div class="num" id="stat-entities">-</div><div class="label">已采集实体</div></div>
          <div class="stat"><div class="num" id="stat-snapshots">-</div><div class="label">快照数</div></div>
        </div>
        <div class="row" style="margin-top:14px"><span style="color:#6b7280;font-size:13px">仓库：<span id="repo-root">-</span></span></div>
      </div>
    </section>
    <section id="page-entities" class="page">
      <div class="card"><h2>已采集实体</h2>
        <table><thead><tr><th>类型</th><th>ID</th><th>备注</th></tr></thead><tbody id="entity-list"></tbody></table>
        <div id="entity-empty" class="empty" style="display:none">无数据（先到「采集」页采集）</div>
      </div>
    </section>
    <section id="page-collect" class="page">
      <div class="card"><h2>采集配置</h2>
        <div class="row">
          <select id="collect-tool">
            <option value="">全部工具</option>
            <option value="claude-code">Claude Code</option>
            <option value="codex">Codex</option>
            <option value="copilot">Copilot</option>
            <option value="zhanlu">Zhanlu</option>
            <option value="gemini">Gemini</option>
          </select>
          <button onclick="doCollect()">开始采集</button>
        </div>
        <div class="msg" id="collect-msg"></div>
      </div>
    </section>
    <section id="page-export" class="page">
      <div class="card"><h2>导出 / 迁移</h2>
        <div class="row">
          <select id="export-to">
            <option value="codex">Codex</option>
            <option value="claude-code">Claude Code</option>
            <option value="copilot">Copilot</option>
            <option value="zhanlu">Zhanlu</option>
            <option value="gemini">Gemini</option>
          </select>
          <button class="sec" onclick="doExport(true)">预览（dry-run）</button>
          <button onclick="doExport(false)">确认导出</button>
        </div>
        <div class="msg" id="export-msg"></div>
        <div class="files" id="export-files"></div>
      </div>
    </section>
    <section id="page-snapshots" class="page">
      <div class="card"><h2>快照</h2>
        <div class="row">
          <input type="text" id="snap-note" placeholder="备注（可选）">
          <button onclick="doSnapshotCreate()">创建快照</button>
        </div>
        <div class="msg" id="snap-msg"></div>
        <table><thead><tr><th>ID</th><th>备注</th><th>文件数</th><th>操作</th></tr></thead><tbody id="snap-list"></tbody></table>
      </div>
    </section>
  </main>
</div><script>
document.querySelectorAll("nav a").forEach(a => {
  a.onclick = () => {
    document.querySelectorAll("nav a").forEach(x => x.classList.remove("active"));
    a.classList.add("active");
    document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
    document.getElementById("page-" + a.dataset.page).classList.add("active");
    if (a.dataset.page === "dashboard") loadOverview();
    if (a.dataset.page === "entities") loadEntities();
    if (a.dataset.page === "snapshots") loadSnapshots();
  };
});
function showMsg(id, text, ok) { const el = document.getElementById(id); el.textContent = text; el.className = "msg " + (ok ? "ok" : "err"); }
function loadOverview() {
  fetch("/api/overview").then(r => r.json()).then(o => {
    document.getElementById("stat-tools").textContent = o.tools ?? "-";
    document.getElementById("stat-entities").textContent = o.entities ?? "-";
    document.getElementById("stat-snapshots").textContent = o.snapshots ?? "-";
    document.getElementById("repo-root").textContent = o.repo_root || "-";
  });
}
function loadEntities() {
  fetch("/api/entities").then(r => r.json()).then(items => {
    const tb = document.getElementById("entity-list");
    tb.innerHTML = "";
    if (!items || items.length === 0) { document.getElementById("entity-empty").style.display = "block"; return; }
    document.getElementById("entity-empty").style.display = "none";
    items.forEach(it => {
      const tr = document.createElement("tr");
      tr.innerHTML = "<td><span class=\"kind\">" + it.kind + "</span></td><td>" + it.id + "</td><td>" + (it.note || "") + "</td>";
      tb.appendChild(tr);
    });
  });
}
function doCollect() {
  const tool = document.getElementById("collect-tool").value;
  showMsg("collect-msg", "采集中…", true);
  fetch("/api/collect", { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({ tool: tool }) })
    .then(r => r.json()).then(res => {
      if (res.ok === "true" || res.ok === true) { showMsg("collect-msg", res.message || "采集完成", true); }
      else { showMsg("collect-msg", res.error || "失败", false); }
    }).catch(e => showMsg("collect-msg", String(e), false));
}
function doExport(dryRun) {
  const to = document.getElementById("export-to").value;
  showMsg("export-msg", dryRun ? "预览中…" : "导出中…", true);
  fetch("/api/export", { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({ to: to, dryRun: dryRun }) })
    .then(r => r.json()).then(res => {
      if (res.ok) {
        showMsg("export-msg", res.message || "完成", true);
        const box = document.getElementById("export-files");
        if (res.files && res.files.length > 0) { box.textContent = res.files.join("\n"); box.style.display = "block"; }
      } else { showMsg("export-msg", res.error || "失败", false); }
    }).catch(e => showMsg("export-msg", String(e), false));
}
function loadSnapshots() {
  fetch("/api/snapshots").then(r => r.json()).then(list => {
    const tb = document.getElementById("snap-list");
    tb.innerHTML = "";
    (list || []).forEach(s => {
      const tr = document.createElement("tr");
      tr.innerHTML = "<td>" + s.id + "</td><td>" + (s.note || "") + "</td><td>" + s.files + "</td><td><button class=\"sec\" onclick=\"doRestore('" + s.id + "')\">恢复</button></td>";
      tb.appendChild(tr);
    });
  });
}
function doSnapshotCreate() {
  const note = document.getElementById("snap-note").value;
  fetch("/api/snapshot/create", { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({ note: note }) })
    .then(r => r.json()).then(res => {
      if (res.ok) { showMsg("snap-msg", "已创建快照 " + res.id, true); loadSnapshots(); }
      else { showMsg("snap-msg", res.error || "失败", false); }
    });
}
function doRestore(id) {
  if (!confirm("确定恢复快照 " + id + "？（会先对现状打反向快照）")) return;
  fetch("/api/snapshot/restore", { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({ id: id }) })
    .then(r => r.json()).then(res => {
      if (res.ok) { showMsg("snap-msg", res.message || "已恢复", true); }
      else { showMsg("snap-msg", res.error || "失败", false); }
    });
}
loadOverview();
</script>
</body>
</html>
